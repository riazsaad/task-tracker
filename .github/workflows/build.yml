name: Build Task Tracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate App Code
        run: |
          mkdir -p app/src/main/java/com/example/tasktracker

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "TaskTracker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.tasktracker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tasktracker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="Task Tracker" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tasktracker/MainActivity.kt
          @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)
          package com.example.tasktracker

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextDecoration
          import androidx.compose.ui.unit.dp
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          enum class TaskStatus(val title: String) {
              TO_BE_COMPLETED("To be completed"),
              IN_PROGRESS("In progress"),
              COMPLETED("Completed");
              fun next() = if (this == TO_BE_COMPLETED) IN_PROGRESS else if (this == IN_PROGRESS) COMPLETED else null
              fun prev() = if (this == COMPLETED) IN_PROGRESS else if (this == IN_PROGRESS) TO_BE_COMPLETED else null
          }

          enum class Priority(val label: String, val bg: Color, val txt: Color) {
              LOW("Low", Color(0xFFE8F5E9), Color(0xFF2E7D32)),
              MEDIUM("Med", Color(0xFFFFF3E0), Color(0xFFEF6C00)),
              HIGH("High", Color(0xFFFFEBEE), Color(0xFFC62828))
          }

          data class TaskItem(val id: String = UUID.randomUUID().toString(), val title: String, val note: String = "", val status: TaskStatus = TaskStatus.TO_BE_COMPLETED, val priority: Priority = Priority.MEDIUM)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) { KanbanApp() }
                      }
                  }
              }
          }

          @Composable
          fun KanbanApp() {
              val ctx = LocalContext.current
              var tasks by remember { mutableStateOf(loadTasks(ctx)) }
              var showAdd by remember { mutableStateOf(false) }
              fun save(list: List<TaskItem>) { tasks = list; saveTasks(ctx, list) }

              Scaffold(
                  topBar = { TopAppBar(title = { Text("Task Tracker", fontWeight = FontWeight.Bold) }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surfaceContainer)) },
                  floatingActionButton = { FloatingActionButton(onClick = { showAdd = true }) { Text("+", style = MaterialTheme.typography.headlineMedium) } }
              ) { pad ->
                  LazyRow(modifier = Modifier.fillMaxSize().padding(pad), contentPadding = PaddingValues(16.dp), horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                      items(TaskStatus.entries.toTypedArray()) { status ->
                          Surface(modifier = Modifier.width(280.dp).fillMaxHeight(), shape = RoundedCornerShape(16.dp), color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.5f)) {
                              val colTasks = tasks.filter { it.status == status }
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Text(status.title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                                      Badge { Text(colTasks.size.toString()) }
                                  }
                                  LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                      items(colTasks, key = { it.id }) { task ->
                                          Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), elevation = CardDefaults.cardElevation(2.dp)) {
                                              Column(modifier = Modifier.padding(12.dp)) {
                                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                                      Box(modifier = Modifier.clip(RoundedCornerShape(4.dp)).background(task.priority.bg).padding(horizontal = 6.dp, vertical = 2.dp)) {
                                                          Text(task.priority.label, color = task.priority.txt, style = MaterialTheme.typography.labelSmall, fontWeight = FontWeight.Bold)
                                                      }
                                                      IconButton(onClick = { save(tasks.filterNot { it.id == task.id }) }, modifier = Modifier.size(24.dp)) { Text("✕", color = MaterialTheme.colorScheme.outline) }
                                                  }
                                                  Spacer(Modifier.height(6.dp))
                                                  Row {
                                                      Text("• ", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                                                      Text(task.title, style = MaterialTheme.typography.titleSmall.copy(textDecoration = if (task.status == TaskStatus.COMPLETED) TextDecoration.LineThrough else null))
                                                  }
                                                  if (task.note.isNotBlank()) {
                                                      Spacer(Modifier.height(4.dp))
                                                      Text("  - ${task.note}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                                  }
                                                  Spacer(Modifier.height(10.dp))
                                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                                      task.status.prev()?.let { prev ->
                                                          FilledTonalButton(onClick = { save(tasks.map { if (it.id == task.id) it.copy(status = prev) else it }) }, modifier = Modifier.height(32.dp), contentPadding = PaddingValues(horizontal = 10.dp, vertical = 0.dp)) { Text("← Move", style = MaterialTheme.typography.labelSmall) }
                                                      } ?: Spacer(Modifier.size(32.dp))
                                                      task.status.next()?.let { next ->
                                                          FilledTonalButton(onClick = { save(tasks.map { if (it.id == task.id) it.copy(status = next) else it }) }, modifier = Modifier.height(32.dp), contentPadding = PaddingValues(horizontal = 10.dp, vertical = 0.dp)) { Text("Move →", style = MaterialTheme.typography.labelSmall) }
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
                  if (showAdd) {
                      var title by remember { mutableStateOf("") }
                      var note by remember { mutableStateOf("") }
                      var prio by remember { mutableStateOf(Priority.MEDIUM) }
                      ModalBottomSheet(onDismissRequest = { showAdd = false }) {
                          Column(modifier = Modifier.fillMaxWidth().padding(20.dp)) {
                              Text("Create Task", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(10.dp))
                              OutlinedTextField(value = title, onValueChange = { title = it }, label = { Text("Task Description") }, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(8.dp))
                              OutlinedTextField(value = note, onValueChange = { note = it }, label = { Text("Sub-bullet / Note") }, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(12.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Priority.entries.forEach { p -> FilterChip(selected = prio == p, onClick = { prio = p }, label = { Text(p.label) }) }
                              }
                              Spacer(Modifier.height(16.dp))
                              Button(onClick = { if (title.isNotBlank()) { save(tasks + TaskItem(title = title, note = note, priority = prio)); showAdd = false } }, enabled = title.isNotBlank(), modifier = Modifier.fillMaxWidth()) { Text("Add Task") }
                          }
                      }
                  }
              }
          }

          fun saveTasks(ctx: Context, tasks: List<TaskItem>) {
              val arr = JSONArray()
              tasks.forEach { t -> arr.put(JSONObject().apply { put("id", t.id); put("title", t.title); put("note", t.note); put("status", t.status.name); put("prio", t.priority.name) }) }
              ctx.getSharedPreferences("t_prefs", Context.MODE_PRIVATE).edit().putString("tasks", arr.toString()).apply()
          }

          fun loadTasks(ctx: Context): List<TaskItem> {
              val raw = ctx.getSharedPreferences("t_prefs", Context.MODE_PRIVATE).getString("tasks", null) ?: return listOf(
                  TaskItem(title = "Design app layout", note = "Modern Kanban board", status = TaskStatus.COMPLETED, priority = Priority.HIGH),
                  TaskItem(title = "Test movement controls", note = "Tap arrow buttons to move", status = TaskStatus.IN_PROGRESS, priority = Priority.MEDIUM),
                  TaskItem(title = "Add your first task", note = "Tap + at bottom right", status = TaskStatus.TO_BE_COMPLETED, priority = Priority.LOW)
              )
              return try {
                  val arr = JSONArray(raw)
                  (0 until arr.length()).map { i ->
                      val o = arr.getJSONObject(i)
                      TaskItem(o.getString("id"), o.getString("title"), o.optString("note", ""), TaskStatus.valueOf(o.getString("status")), Priority.valueOf(o.getString("prio")))
                  }
              } catch (_: Exception) { emptyList() }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskTracker-App
          path: "**/*.apk"
